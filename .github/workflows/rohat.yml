name: ClipCrip4 Rohat Bot

'on':
  workflow_dispatch:
  schedule:
    - cron: "34 6 * * *"

jobs:
  rohat:
    uses: ./.github/workflows/_clip-engine.yml
    with:
      streamer_label: Rohat
      discovery_script: rohat/scripts/get_clips.py
      download_script: rohat/scripts/download_clips.py
      quality_script: rohat/scripts/quality_control.py
      process_script: rohat/scripts/process_clips.py
      output_dir: rohat/tiktok_ready
      used_file: rohat/used_clips.json
      history_file: rohat/clip_history.json
      drive_folder_id: 17EWSohhCaEYXvjzrQBgWIR9Ld5kHKaye
      artifact_name: Rohat-ClipCrip4-Quality-Clips
      bot_name: clipcrip4-bot
    secrets: inherit
