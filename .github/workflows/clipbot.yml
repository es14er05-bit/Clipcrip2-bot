name: ClipCrip2 Bot

on:
  workflow_dispatch:

jobs:
  test-download:
    runs-on: ubuntu-latest

    steps:
      - name: Repository laden
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: yt-dlp installieren
        run: pip install yt-dlp

      - name: Download-Ordner erstellen
        run: mkdir -p downloaded_clips

      - name: Jussef Clip herunterladen
        run: |
          yt-dlp \
            --no-playlist \
            -o "downloaded_clips/jussef_test.%(ext)s" \
            "https://www.twitch.tv/jussef/clip/ObesePlainCaribouDatBoi-hsk3_1eft3oXVzRB"

      - name: Fertigen Clip als Artifact speichern
        uses: actions/upload-artifact@v4
        with:
          name: jussef-test-clip
          path: downloaded_clips/
