name: ClipCrip2 Bot

on:
  workflow_dispatch:
  schedule:
    - cron: "0 8 * * *"

jobs:
  clips-holen:
    runs-on: ubuntu-latest

    steps:

      - name: Repository laden
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Abhängigkeiten installieren
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          pip install requests yt-dlp openai-whisper ultralytics opencv-python-headless

      - name: Twitch Clips finden
        env:
          TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
          TWITCH_CLIENT_SECRET: ${{ secrets.TWITCH_CLIENT_SECRET }}
        run: |
          python scripts/get_clips.py

      - name: Twitch Clips herunterladen
        run: |
          python scripts/download_clips.py

      - name: Videos bearbeiten
        run: |
          python scripts/process_clips.py

      - name: Fertige TikTok Videos speichern
        uses: actions/upload-artifact@v4
        with:
          name: tiktok-ready-${{ github.run_number }}
          path: tiktok_ready/
          if-no-files-found: error
