name: ClipCrip2 Bot

on:
  workflow_dispatch:
  schedule:
    - cron: "0 8 * * *"

permissions:
  contents: write

jobs:
  clips-holen:
    runs-on: ubuntu-latest

    steps:

      - name: Repository laden
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Abhängigkeiten installieren
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          pip install requests yt-dlp openai-whisper ultralytics opencv-python-headless numpy

      - name: Twitch Clips finden
        env:
          TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
          TWITCH_CLIENT_SECRET: ${{ secrets.TWITCH_CLIENT_SECRET }}
        run: python scripts/get_clips.py

      - name: 20 Kandidaten herunterladen
        run: python scripts/download_clips.py

      - name: Qualitätskontrolle
        run: python scripts/quality_control.py

      - name: Videos bearbeiten
        run: python scripts/process_clips.py

      - name: Fertige TikTok Videos speichern
        uses: actions/upload-artifact@v4
        with:
          name: Yussef TikTok Clips
          path: tiktok_ready/
          if-no-files-found: error

      - name: Clip-Historie dauerhaft speichern
        run: |
          git config user.name "ClipCrip2 Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add used_clips.json clip_history.json

          if git diff --cached --quiet; then
            echo "Keine Änderungen an der Clip-Historie."
            exit 0
          fi

          git commit -m "Update clip history"

          git pull --rebase origin main

          git push origin main