name: ClipCrip2 Bot

on:
  workflow_dispatch:

  schedule:
    - cron: "10 6 * * *"

concurrency:
  group: clipcrip2-bot
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  clips-holen:
    runs-on: ubuntu-latest

    steps:

      # ==========================================
      # REPOSITORY
      # ==========================================

      - name: Repository laden
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ==========================================
      # PYTHON
      # ==========================================

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # ==========================================
      # ABHÄNGIGKEITEN
      # ==========================================

      - name: Abhängigkeiten installieren
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

          python -m pip install --upgrade pip

          pip install \
            requests \
            yt-dlp \
            openai-whisper \
            ultralytics \
            opencv-python-headless \
            numpy

      # ==========================================
      # 1. TWITCH CLIPS FINDEN
      # ==========================================

      - name: Twitch Clips finden
        env:
          TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
          TWITCH_CLIENT_SECRET: ${{ secrets.TWITCH_CLIENT_SECRET }}
        run: |
          python scripts/get_clips.py

      # ==========================================
      # 2. CLIPS HERUNTERLADEN
      # ==========================================

      - name: Twitch Clips herunterladen
        run: |
          python scripts/download_clips.py

      # ==========================================
      # 3. QUALITÄTSKONTROLLE
      # ==========================================

      - name: Multi-Stage Quality Control
        run: |
          python scripts/quality_control.py

      # ==========================================
      # 4. TIKTOK VIDEOS ERSTELLEN
      # ==========================================

      - name: Videos bearbeiten
        run: |
          python scripts/process_clips.py

      # ==========================================
      # 5. GITHUB ARTIFACT
      # ==========================================

      - name: Fertige TikTok Videos speichern
        uses: actions/upload-artifact@v4
        with:
          name: Yussef-TikTok-Clips
          path: tiktok_ready/
          if-no-files-found: error
          retention-days: 7

      # ==========================================
      # 6. GOOGLE ACCESS TOKEN HOLEN
      # ==========================================

      - name: Google Drive anmelden
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}

        run: |
          python - <<'PY'
          import json
          import os
          import time
          import urllib.parse
          import urllib.request
          import urllib.error

          def request_with_retry(request, attempts=5):

              last_error = None

              for attempt in range(
                  1,
                  attempts + 1
              ):

                  try:

                      return urllib.request.urlopen(
                          request,
                          timeout=60
                      )

                  except Exception as error:

                      last_error = error

                      print(
                          f"Google Login Versuch "
                          f"{attempt}/{attempts} "
                          f"fehlgeschlagen: {error}"
                      )

                      if attempt < attempts:

                          wait = attempt * 5

                          print(
                              f"Warte {wait} Sekunden..."
                          )

                          time.sleep(wait)

              raise last_error


          data = urllib.parse.urlencode({

              "client_id":
                  os.environ["GOOGLE_CLIENT_ID"],

              "client_secret":
                  os.environ["GOOGLE_CLIENT_SECRET"],

              "refresh_token":
                  os.environ["GOOGLE_REFRESH_TOKEN"],

              "grant_type":
                  "refresh_token",

          }).encode()


          request = urllib.request.Request(

              "https://oauth2.googleapis.com/token",

              data=data,

              method="POST",

          )


          with request_with_retry(
              request
          ) as response:

              result = json.load(
                  response
              )


          access_token = result[
              "access_token"
          ]


          with open(
              os.environ["GITHUB_ENV"],
              "a",
              encoding="utf-8"
          ) as env_file:

              env_file.write(
                  "GOOGLE_DRIVE_ACCESS_TOKEN="
                  + access_token
                  + "\n"
              )


          print(
              "Google Drive Login erfolgreich."
          )

          PY

      # ==========================================
      # 7. VIDEOS ZU GOOGLE DRIVE
      # ==========================================

      - name: Fertige Videos zu Google Drive hochladen
        env:
          DRIVE_FOLDER_ID: "14uloS4MQUcnIR-u-0aVOj1NLu3xu975R"

        run: |
          python - <<'PY'
          import glob
          import json
          import mimetypes
          import os
          import socket
          import ssl
          import time
          import urllib.parse
          import urllib.request
          import urllib.error
          import uuid


          # ======================================
          # RETRY
          # ======================================

          def request_with_retry(
              request_factory,
              description,
              attempts=6,
              timeout=180
          ):

              last_error = None

              for attempt in range(
                  1,
                  attempts + 1
              ):

                  try:

                      request = request_factory()

                      response = urllib.request.urlopen(
                          request,
                          timeout=timeout
                      )

                      return response

                  except (
                      urllib.error.URLError,
                      urllib.error.HTTPError,
                      ConnectionResetError,
                      ConnectionAbortedError,
                      ConnectionError,
                      TimeoutError,
                      socket.timeout,
                      ssl.SSLError,
                      OSError,
                  ) as error:

                      last_error = error

                      print("")
                      print(
                          f"WARNUNG: {description}"
                      )

                      print(
                          f"Versuch "
                          f"{attempt}/{attempts} "
                          f"fehlgeschlagen."
                      )

                      print(
                          f"Fehler: {error}"
                      )

                      if isinstance(
                          error,
                          urllib.error.HTTPError
                      ):

                          # 4xx Fehler wie 400/401/403
                          # normalerweise nicht blind
                          # mehrfach versuchen.
                          #
                          # 408, 429 und 5xx dürfen
                          # erneut versucht werden.

                          if (
                              error.code
                              not in (
                                  408,
                                  429,
                                  500,
                                  502,
                                  503,
                                  504,
                              )
                          ):

                              try:

                                  body = (
                                      error.read()
                                      .decode(
                                          "utf-8",
                                          errors="replace"
                                      )
                                  )

                                  print(
                                      "Google Antwort:"
                                  )

                                  print(
                                      body[:2000]
                                  )

                              except Exception:

                                  pass

                              raise

                      if attempt >= attempts:

                          break

                      wait = min(
                          60,
                          5 * (
                              2 ** (
                                  attempt - 1
                              )
                          )
                      )

                      print(
                          f"Warte {wait} Sekunden "
                          "und versuche es erneut..."
                      )

                      time.sleep(
                          wait
                      )

              raise RuntimeError(
                  f"{description} nach "
                  f"{attempts} Versuchen "
                  f"fehlgeschlagen: "
                  f"{last_error}"
              )


          # ======================================
          # DATEIEN
          # ======================================

          files = sorted(
              glob.glob(
                  "tiktok_ready/*.mp4"
              )
          )


          print(
              f"{len(files)} fertige Videos gefunden."
          )


          if len(files) != 5:

              raise RuntimeError(

                  "Es müssen genau 5 fertige "
                  "MP4-Dateien vorhanden sein. "
                  f"Gefunden: {len(files)}"

              )


          token = os.environ[
              "GOOGLE_DRIVE_ACCESS_TOKEN"
          ]


          folder_id = os.environ[
              "DRIVE_FOLDER_ID"
          ]


          # ======================================
          # AUTH HEADER
          # ======================================

          def auth_headers():

              return {

                  "Authorization":
                      f"Bearer {token}",

                  "User-Agent":
                      "ClipCrip2-GitHub-Actions/1.0",

                  "Connection":
                      "close",

              }


          # ======================================
          # DATEI SUCHEN
          # ======================================

          def find_existing(
              filename
          ):

              safe_filename = (
                  filename
                  .replace(
                      "\\",
                      "\\\\"
                  )
                  .replace(
                      "'",
                      "\\'"
                  )
              )


              query = (

                  f"name='{safe_filename}' "
                  f"and '{folder_id}' in parents "
                  "and trashed=false"

              )


              list_url = (

                  "https://www.googleapis.com/"
                  "drive/v3/files?"

                  + urllib.parse.urlencode({

                      "q":
                          query,

                      "fields":
                          "files(id,name,size)",

                      "spaces":
                          "drive",

                  })

              )


              def make_request():

                  return urllib.request.Request(

                      list_url,

                      headers=auth_headers(),

                  )


              with request_with_retry(

                  make_request,

                  f"Drive-Suche für {filename}",

                  attempts=6,

                  timeout=60

              ) as response:

                  result = json.load(
                      response
                  )


              return result.get(
                  "files",
                  []
              )


          # ======================================
          # DATEI LÖSCHEN
          # ======================================

          def delete_file(
              file_id,
              filename
          ):

              url = (

                  "https://www.googleapis.com/"
                  "drive/v3/files/"
                  + file_id

              )


              def make_request():

                  return urllib.request.Request(

                      url,

                      method="DELETE",

                      headers=auth_headers(),

                  )


              with request_with_retry(

                  make_request,

                  f"Alte Drive-Datei löschen: "
                  f"{filename}",

                  attempts=6,

                  timeout=60

              ):

                  pass


          # ======================================
          # VIDEO UPLOAD
          # ======================================

          def upload_video(
              path,
              filename,
              mime_type
          ):

              metadata = {

                  "name":
                      filename,

                  "parents":
                      [folder_id],

              }


              with open(
                  path,
                  "rb"
              ) as video_file:

                  video_data = (
                      video_file.read()
                  )


              print(
                  f"Dateigröße: "
                  f"{len(video_data) / 1024 / 1024:.1f} MB"
              )


              upload_url = (

                  "https://www.googleapis.com/"
                  "upload/drive/v3/files"
                  "?uploadType=multipart"
                  "&fields=id,name,size"

              )


              def make_request():

                  # WICHTIG:
                  # Bei jedem Retry neue Boundary
                  # und neuen Request erstellen.

                  boundary = (

                      "clipcrip2_"
                      + uuid.uuid4().hex

                  )


                  header = (

                      f"--{boundary}\r\n"

                      "Content-Type: "
                      "application/json; "
                      "charset=UTF-8\r\n\r\n"

                      + json.dumps(
                          metadata
                      )

                      + "\r\n"

                      f"--{boundary}\r\n"

                      f"Content-Type: "
                      f"{mime_type}\r\n\r\n"

                  ).encode(
                      "utf-8"
                  )


                  footer = (

                      f"\r\n"
                      f"--{boundary}--\r\n"

                  ).encode(
                      "utf-8"
                  )


                  body = (

                      header
                      + video_data
                      + footer

                  )


                  headers = auth_headers()

                  headers.update({

                      "Content-Type":
                          "multipart/related; "
                          f"boundary={boundary}",

                      "Content-Length":
                          str(
                              len(body)
                          ),

                  })


                  return urllib.request.Request(

                      upload_url,

                      data=body,

                      method="POST",

                      headers=headers,

                  )


              with request_with_retry(

                  make_request,

                  f"Upload von {filename}",

                  attempts=6,

                  timeout=300

              ) as response:

                  return json.load(
                      response
                  )


          # ======================================
          # ALLE 5 VERARBEITEN
          # ======================================

          uploaded_count = 0


          for index, path in enumerate(
              files,
              start=1
          ):

              filename = os.path.basename(
                  path
              )


              mime_type = (

                  mimetypes.guess_type(
                      filename
                  )[0]

                  or "video/mp4"

              )


              print("")
              print(
                  "======================================"
              )

              print(
                  f"GOOGLE DRIVE VIDEO {index}/5"
              )

              print(
                  "======================================"
              )

              print(
                  f"Datei: {filename}"
              )


              # ----------------------------------
              # VORHANDENE DATEIEN FINDEN
              # ----------------------------------

              existing = find_existing(
                  filename
              )


              if existing:

                  print(
                      f"{len(existing)} alte "
                      "Version(en) gefunden."
                  )

              else:

                  print(
                      "Keine alte Version gefunden."
                  )


              # ----------------------------------
              # NEUES VIDEO ZUERST HOCHLADEN
              #
              # Wichtig:
              # Wir löschen die alte Version
              # NICHT bevor sicher ist, dass der
              # neue Upload funktioniert.
              # ----------------------------------

              print(
                  "Neue Version wird hochgeladen..."
              )


              uploaded = upload_video(

                  path,
                  filename,
                  mime_type

              )


              new_id = uploaded[
                  "id"
              ]


              print(
                  "UPLOAD ERFOLGREICH: "
                  + uploaded["name"]
                  + " | ID: "
                  + new_id
              )


              # ----------------------------------
              # ERST JETZT ALTE VERSIONEN LÖSCHEN
              # ----------------------------------

              for old in existing:

                  old_id = old.get(
                      "id"
                  )

                  old_name = old.get(
                      "name",
                      filename
                  )


                  if (
                      not old_id
                      or old_id == new_id
                  ):

                      continue


                  print(
                      "Alte Version wird gelöscht: "
                      + old_name
                  )


                  delete_file(
                      old_id,
                      old_name
                  )


              # ----------------------------------
              # KONTROLLE
              # ----------------------------------

              verification = find_existing(
                  filename
              )


              matching_new = [

                  item
                  for item in verification
                  if item.get(
                      "id"
                  ) == new_id

              ]


              if not matching_new:

                  raise RuntimeError(

                      "Drive-Verifikation "
                      "fehlgeschlagen für "
                      + filename

                  )


              uploaded_count += 1


              print(
                  f"GOOGLE DRIVE OK "
                  f"({uploaded_count}/5): "
                  f"{filename}"
              )


              # Kleine Pause zwischen Uploads,
              # damit nicht 5 große Requests
              # unmittelbar hintereinander kommen.

              if index < len(files):

                  print(
                      "Warte 3 Sekunden vor "
                      "dem nächsten Upload..."
                  )

                  time.sleep(
                      3
                  )


          # ======================================
          # FINALE PRÜFUNG
          # ======================================

          if uploaded_count != 5:

              raise RuntimeError(

                  "Nicht alle Videos wurden "
                  "erfolgreich hochgeladen. "
                  f"Erfolg: {uploaded_count}/5"

              )


          print("")
          print(
              "======================================"
          )

          print(
              "GOOGLE DRIVE ERFOLGREICH"
          )

          print(
              "Alle 5 Videos wurden hochgeladen."
          )

          print(
              "======================================"
          )

          PY

      # ==========================================
      # 8. BENUTZTE CLIPS SPEICHERN
      # ==========================================

      - name: Benutzte Clips dauerhaft speichern
        run: |

          git config user.name "ClipCrip2 Bot"

          git config user.email \
            "clipcrip2-bot@users.noreply.github.com"

          git add \
            used_clips.json \
            clip_history.json

          if git diff --cached --quiet; then

            echo \
              "Keine Änderungen an der Clip-Historie."

            exit 0

          fi

          git commit \
            -m "Update used Twitch clips"

          git pull \
            --rebase \
            origin main

          git push \
            origin main