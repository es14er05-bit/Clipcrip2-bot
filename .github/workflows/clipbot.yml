name: ClipCrip2 Jussef Bot

'on':
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * *"

jobs:
  jussef:
    uses: ./.github/workflows/_clip-engine.yml
    with:
      streamer_label: Jussef
      discovery_script: scripts/get_clips.py
      download_script: scripts/download_clips.py
      quality_script: scripts/quality_control.py
      process_script: scripts/process_clips.py
      output_dir: tiktok_ready
      used_file: used_clips.json
      history_file: clip_history.json
      drive_folder_id: 14uloS4MQUcnIR-u-0aVOj1NLu3xu975R
      artifact_name: Jussef-ClipCrip2-Quality-Clips
      bot_name: clipcrip2-bot
    secrets: inherit
