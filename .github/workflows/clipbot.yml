name: ClipCrip2 Bot

on:
  workflow_dispatch:
  schedule:
    - cron: "0 8 * * *"

jobs:
  clips-holen:
    runs-on: ubuntu-latest

    steps:
      - name: Repository laden
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Abhängigkeiten installieren
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          pip install requests yt-dlp openai-whisper ultralytics opencv-python-headless

      - name: Twitch Clips finden
        env:
          TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
          TWITCH_CLIENT_SECRET: ${{ secrets.TWITCH_CLIENT_SECRET }}
        run: python scripts/get_clips.py

      - name: Twitch Clips herunterladen
        run: python scripts/download_clips.py

      - name: Videos bearbeiten
        run: python scripts/process_clips.py

      - name: Erfolgreich verarbeitete Clips als benutzt markieren
        run: |
          python - <<'PY'
          import json
          import os

          clips_file = "clips_today.json"
          used_file = "used_clips.json"

          with open(clips_file, "r", encoding="utf-8") as f:
              clips = json.load(f)

          if os.path.exists(used_file):
              try:
                  with open(used_file, "r", encoding="utf-8") as f:
                      used = set(json.load(f))
              except Exception:
                  used = set()
          else:
              used = set()

          for clip in clips:
              used.add(clip["id"])

          with open(used_file, "w", encoding="utf-8") as f:
              json.dump(
                  sorted(used),
                  f,
                  indent=2,
                  ensure_ascii=False
              )

          print(f"{len(clips)} Clips als benutzt gespeichert.")
          print(f"Insgesamt gespeichert: {len(used)}")
          PY

      - name: Änderungen speichern
        run: |
          git config user.name "ClipCrip2 Bot"
          git config user.email "clipcrip2-bot@users.noreply.github.com"

          git add used_clips.json

          if git diff --cached --quiet; then
            echo "Keine Änderungen an used_clips.json."
          else
            git commit -m "Mark processed clips as used"
            git push
          fi

      - name: Fertige TikTok Videos speichern
        uses: actions/upload-artifact@v4
        with:
          name: tiktok-ready
          path: tiktok_ready/
          if-no-files-found: error
