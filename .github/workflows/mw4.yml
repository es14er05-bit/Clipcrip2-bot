name: MW4 - zwei Uploadpakete

on:
  workflow_dispatch:
    inputs:
      batch_date:
        description: "Optional: vorhandenen Tag erneut rendern (JJJJ-MM-TT)"
        required: false
        type: string
  schedule:
    - cron: "15 6 * * *"

permissions:
  contents: write

concurrency:
  group: mw4-production
  cancel-in-progress: false

jobs:
  produce:
    if: github.event_name == 'workflow_dispatch' || vars.MW4_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 35

    env:
      GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
      GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
      GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
      MW4_DRIVE_FOLDER_ID: ${{ vars.MW4_DRIVE_FOLDER_ID }}

    steps:
      - name: Standardbranch laden
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: mw4/requirements.txt

      - name: Abhängigkeiten installieren
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core
          python -m pip install -r mw4/requirements.txt

      - name: Tagesdatum festlegen
        id: day
        env:
          REQUESTED_DAY: ${{ inputs.batch_date }}
        run: |
          python - <<'PY'
          import os
          from datetime import date, datetime
          from zoneinfo import ZoneInfo

          value = os.environ.get("REQUESTED_DAY", "").strip()
          value = value or datetime.now(
              ZoneInfo("Europe/Berlin")
          ).date().isoformat()

          if date.fromisoformat(value).isoformat() != value:
              raise SystemExit("Datum muss JJJJ-MM-TT sein")

          with open(os.environ["GITHUB_OUTPUT"], "a") as stream:
              stream.write(f"value={value}\n")
          PY

      - name: Genau zwei Quellen reservieren
        env:
          BATCH_DAY: ${{ steps.day.outputs.value }}
        run: python mw4/bot.py prepare --day "$BATCH_DAY"

      - name: Reservierung vor der Ausgabe dauerhaft sichern
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          git config user.name "MW4 Bot"
          git config user.email "mw4-bot@users.noreply.github.com"

          git add mw4/state/mw4.json

          if ! git diff --cached --quiet; then
            git commit -m "Reserve MW4 source batch"

            for attempt in 1 2 3; do
              git pull --rebase origin "$DEFAULT_BRANCH"

              if git push origin "HEAD:$DEFAULT_BRANCH"; then
                exit 0
              fi
            done

            echo "Reservierung nicht gespeichert; keine Ausgabe freigegeben."
            exit 1
          fi

      - name: Zwei Videos und Captions rendern
        env:
          BATCH_DAY: ${{ steps.day.outputs.value }}
        run: python mw4/bot.py render --day "$BATCH_DAY"

      - name: Tagespaket sichern
        uses: actions/upload-artifact@v4
        with:
          name: MW4-${{ steps.day.outputs.value }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: mw4/output/MW4_${{ steps.day.outputs.value }}.zip
          if-no-files-found: error
          retention-days: 30

      - name: Optional in separaten Drive-Ordner laden
        env:
          BATCH_DAY: ${{ steps.day.outputs.value }}
        run: python mw4/bot.py upload --day "$BATCH_DAY"

      - name: Ergebnis anzeigen
        if: success()
        run: |
          python - <<'PY'
          import os

          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as stream:
              stream.write(
                  "Zwei Entwürfe erstellt. "
                  "Vor jedem Posting VOR_DEM_POSTEN.txt prüfen.\n\n"
              )
              stream.write(
                  "Nichts wurde auf TikTok veröffentlicht "
                  "oder bei Content Rewards eingereicht.\n"
              )
          PY