name: ClipCrip5 Giggand Bot

'on':
  workflow_dispatch:
  schedule:
    - cron: "51 6 * * *"

jobs:
  giggand:
    uses: ./.github/workflows/_clip-engine.yml
    with:
      streamer_label: Giggand
      discovery_script: giggand/scripts/get_clips.py
      download_script: giggand/scripts/download_clips.py
      quality_script: giggand/scripts/quality_control.py
      process_script: giggand/scripts/process_clips.py
      output_dir: giggand/tiktok_ready
      used_file: giggand/used_clips.json
      history_file: giggand/clip_history.json
      drive_folder_id: 1wSmQ5LdHOOvPNKC4QXWMsh-b_ETn1T7V
      artifact_name: Giggand-ClipCrip5-Quality-Clips
      bot_name: clipcrip5-bot
    secrets: inherit
