      # ============================================================
      # HISTORY PERSISTIEREN
      # ============================================================

      - name: ClipCrip3 History speichern
        run: |
          git config user.name "clipcrip3-us-bot"
          git config user.email "clipcrip3-us@users.noreply.github.com"

          git add \
            us/used_clips.json \
            us/clip_history.json

          if git diff --cached --quiet; then
            echo "Keine neue History."
            exit 0
          fi

          git commit -m "Update ClipCrip3 US history"

          for attempt in 1 2 3 4 5; do

            git pull --rebase origin main

            if git push origin HEAD:main; then
              echo "History gespeichert."
              exit 0
            fi

            echo "Push Retry $attempt/5"

            sleep 2

          done

          echo "History Push fehlgeschlagen."
          exit 1
