name: ClipCrip3 US Bot

'on':
  workflow_dispatch:

  schedule:
    # 09:12 UTC = 11:12 Uhr in Deutschland während Sommerzeit.
    # So erwischen wir US-Content aus der vorherigen Nacht.
    - cron: "12 9 * * *"

permissions:
  contents: write

concurrency:
  group: clipcrip3-us-bot
  cancel-in-progress: false

jobs:
  produce:
    name: Kai + Speed + N3on produzieren
    runs-on: ubuntu-latest
    timeout-minutes: 150

    steps:

      - name: Repository laden
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Whisper cachen
        uses: actions/cache@v4
        with:
          path: ~/.cache/whisper
          key: whisper-turbo-${{ runner.os }}-v1

      - name: Programme installieren
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            ffmpeg \
            fonts-dejavu-core \
            fonts-liberation

          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # ============================================================
      # CLIPCRIP3 HISTORY
      # ============================================================

      - name: ClipCrip3 Ordner vorbereiten
        run: |
          mkdir -p us

          if [ ! -f us/used_clips.json ]; then
            echo '[]' > us/used_clips.json
          fi

          if [ ! -f us/clip_history.json ]; then
            echo '{}' > us/clip_history.json
          fi

          mkdir -p us/downloaded_clips
          mkdir -p us/selected_clips
          mkdir -p us/tiktok_ready

      # ============================================================
      # DISCOVERY
      #
      # KAI:
      # Twitch Clips
      #
      # SPEED:
      # YouTube Livestream VODs
      # -> Most-Replayed/Heatmap Peaks
      # -> nur kurze 34s Stellen
      #
      # Wenn YouTube keine Heatmap liefert:
      # -> Twitch Speed als Fallback
      #
      # N3ON:
      # Kick Clips
      # ============================================================

      - name: US Clips finden
        env:
          TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
          TWITCH_CLIENT_SECRET: ${{ secrets.TWITCH_CLIENT_SECRET }}

        run: |
          python - <<'PY'
          from __future__ import annotations

          import datetime as dt
          import importlib.util
          import json
          import subprocess
          import sys
          from pathlib import Path

          import requests


          ROOT = Path.cwd()

          USED_FILE = ROOT / "us" / "used_clips.json"
          HISTORY_FILE = ROOT / "us" / "clip_history.json"
          OUTPUT_FILE = ROOT / "us" / "clips_today.json"

          CORE_FILE = ROOT / "scripts" / "get_clips.py"

          KAI_LOGIN = "kaicenat"

          SPEED_TWITCH_LOGIN = "ishowspeed"

          SPEED_YOUTUBE = (
              "https://www.youtube.com/"
              "@IShowSpeed/streams"
          )

          N3ON_KICK = "n3on"


          # --------------------------------------------------------
          # SHARED CORE LADEN
          # --------------------------------------------------------

          spec = importlib.util.spec_from_file_location(
              "clipcrip_core",
              CORE_FILE,
          )

          if (
              spec is None
              or spec.loader is None
          ):
              raise RuntimeError(
                  "Shared get_clips.py konnte "
                  "nicht geladen werden."
              )

          core = importlib.util.module_from_spec(
              spec
          )

          spec.loader.exec_module(
              core
          )


          # US-Account:
          # frischer als unsere deutschen Bots.

          core.LOOKBACK_DAYS = 30

          core.WINDOW_DAYS = 7

          core.MAX_PAGES_PER_WINDOW = 2

          core.CANDIDATE_COUNT = 18

          core.MAX_CANDIDATES_PER_VOD = 3

          core.MIN_DURATION_SECONDS = 8.0


          core.REACTION_TERMS = {

              "crashout": 4.0,

              "crash out": 4.0,

              "rage": 3.5,

              "scream": 3.0,

              "screaming": 3.0,

              "wtf": 3.0,

              "oh my god": 3.0,

              "omg": 2.5,

              "no way": 3.0,

              "crazy": 2.0,

              "insane": 2.5,

              "funny": 2.0,

              "fail": 2.5,

              "roast": 2.5,

              "caught": 2.0,

              "exposed": 2.0,

              "troll": 2.0,

              "reaction": 1.5,
          }


          # --------------------------------------------------------
          # JSON
          # --------------------------------------------------------

          def load_json(
              path,
              default,
          ):

              try:

                  return json.loads(
                      Path(path).read_text(
                          encoding="utf-8"
                      )
                  )

              except Exception:

                  return default


          def save_json(
              path,
              value,
          ):

              Path(path).parent.mkdir(
                  parents=True,
                  exist_ok=True,
              )

              Path(path).write_text(

                  json.dumps(
                      value,
                      indent=2,
                      ensure_ascii=False,
                  ),

                  encoding="utf-8",
              )


          # --------------------------------------------------------
          # TWITCH
          # --------------------------------------------------------

          def twitch_clips(
              login,
              label,
          ):

              session = core.build_session()

              try:

                  token = core.get_token(
                      session
                  )

                  core.BROADCASTER_LOGIN = (
                      login
                  )

                  broadcaster_id = (
                      core.get_broadcaster_id(
                          session,
                          token,
                      )
                  )

                  clips = core.get_all_clips(
                      token,
                      broadcaster_id,
                      session=session,
                  )

              finally:

                  session.close()


              for clip in clips:

                  clip[
                      "broadcaster_name"
                  ] = label

                  clip[
                      "source"
                  ] = "twitch"


              print(
                  f"Twitch/{label}: "
                  f"{len(clips)} Clips"
              )

              return clips


          # --------------------------------------------------------
          # YT-DLP METADATA
          # --------------------------------------------------------

          def ytdlp_json(
              url,
              flat=False,
          ):

              command = [

                  sys.executable,
                  "-m",
                  "yt_dlp",

                  "--dump-single-json",

                  "--skip-download",

                  "--no-warnings",

                  "--ignore-errors",
              ]

              if flat:

                  command += [

                      "--flat-playlist",

                      "--playlist-end",
                      "5",
                  ]

              command.append(
                  url
              )


              result = subprocess.run(

                  command,

                  capture_output=True,

                  text=True,

                  check=False,

                  timeout=120,
              )


              text = (
                  result.stdout
                  or ""
              ).strip()


              if not text:

                  print(
                      "YT-DLP WARNUNG:",
                      (
                          result.stderr
                          or ""
                      )[-700:],
                  )

                  return None


              try:

                  return json.loads(
                      text
                  )

              except Exception:

                  # Defensive fallback,
                  # falls yt-dlp Zusatztext liefert.

                  for line in reversed(
                      text.splitlines()
                  ):

                      line = line.strip()

                      if not line.startswith(
                          "{"
                      ):
                          continue

                      try:

                          return json.loads(
                              line
                          )

                      except Exception:

                          continue


              return None


          # --------------------------------------------------------
          # SPEED YOUTUBE
          #
          # Wir laden NICHT den ganzen Stream herunter.
          #
          # yt-dlp liefert bei vielen YouTube-Videos
          # die Most-Replayed Heatmap.
          #
          # Daraus nehmen wir die Peak-Stellen.
          # --------------------------------------------------------

          def speed_youtube_segments():

              print(
                  "Speed/YouTube: "
                  "Livestream-VODs prüfen..."
              )


              playlist = ytdlp_json(
                  SPEED_YOUTUBE,
                  flat=True,
              )


              if not isinstance(
                  playlist,
                  dict,
              ):

                  print(
                      "Speed/YT: "
                      "keine Playlistdaten."
                  )

                  return []


              entries = playlist.get(
                  "entries",
                  [],
              )


              if not isinstance(
                  entries,
                  list,
              ):

                  return []


              results = []


              for entry in entries[:5]:

                  if not isinstance(
                      entry,
                      dict,
                  ):
                      continue


                  raw_url = str(
                      entry.get(
                          "webpage_url"
                      )
                      or entry.get(
                          "url"
                      )
                      or ""
                  ).strip()


                  video_id = str(
                      entry.get(
                          "id"
                      )
                      or ""
                  ).strip()


                  if (
                      raw_url
                      and not raw_url.startswith(
                          "http"
                      )
                  ):

                      if not video_id:

                          video_id = raw_url

                      raw_url = (
                          "https://www.youtube.com/"
                          "watch?v="
                          + video_id
                      )


                  if (
                      not raw_url
                      and video_id
                  ):

                      raw_url = (
                          "https://www.youtube.com/"
                          "watch?v="
                          + video_id
                      )


                  if not raw_url:

                      continue


                  info = ytdlp_json(
                      raw_url
                  )


                  if not isinstance(
                      info,
                      dict,
                  ):

                      continue


                  live_status = str(
                      info.get(
                          "live_status",
                          "",
                      )
                  ).lower()


                  if (
                      live_status
                      in {
                          "is_live",
                          "is_upcoming",
                      }
                      or bool(
                          info.get(
                              "is_live"
                          )
                      )
                  ):

                      print(
                          "Speed/YT: "
                          "laufender Stream "
                          "übersprungen."
                      )

                      continue


                  try:

                      duration = float(
                          info.get(
                              "duration"
                          )
                          or 0
                      )

                  except Exception:

                      duration = 0.0


                  if duration < 240:

                      continue


                  video_id = str(
                      info.get(
                          "id"
                      )
                      or video_id
                  ).strip()


                  if not video_id:

                      continue


                  title = str(
                      info.get(
                          "title"
                      )
                      or "IShowSpeed livestream"
                  ).strip()


                  try:

                      views = int(
                          info.get(
                              "view_count"
                          )
                          or 0
                      )

                  except Exception:

                      views = 0


                  created_at = ""


                  timestamp = (

                      info.get(
                          "timestamp"
                      )

                      or info.get(
                          "release_timestamp"
                      )
                  )


                  if isinstance(
                      timestamp,
                      (int, float),
                  ):

                      created_at = (

                          dt.datetime
                          .fromtimestamp(
                              timestamp,
                              tz=dt.timezone.utc,
                          )
                          .isoformat()
                          .replace(
                              "+00:00",
                              "Z",
                          )
                      )


                  if not created_at:

                      upload_date = str(
                          info.get(
                              "upload_date"
                          )
                          or ""
                      )


                      if (
                          len(upload_date) == 8
                          and upload_date.isdigit()
                      ):

                          created_at = (

                              upload_date[:4]
                              + "-"
                              + upload_date[4:6]
                              + "-"
                              + upload_date[6:]
                              + "T12:00:00Z"
                          )


                  heatmap = info.get(
                      "heatmap"
                  ) or []


                  if not isinstance(
                      heatmap,
                      list,
                  ):

                      heatmap = []


                  peaks = []


                  for heat in heatmap:

                      if not isinstance(
                          heat,
                          dict,
                      ):
                          continue


                      try:

                          start = float(
                              heat.get(
                                  "start_time"
                              )
                              or 0
                          )

                          end = float(
                              heat.get(
                                  "end_time"
                              )
                              or start
                          )

                          value = float(
                              heat.get(
                                  "value"
                              )
                              or 0
                          )

                      except Exception:

                          continue


                      center = (
                          start
                          + end
                      ) / 2


                      # Intro/Outro vermeiden.

                      if center < 45:

                          continue


                      if center > (
                          duration - 45
                      ):

                          continue


                      peaks.append(

                          (
                              value,
                              center,
                          )
                      )


                  peaks.sort(
                      reverse=True,
                      key=lambda item: item[0],
                  )


                  chosen = []


                  for (
                      heat_value,
                      center,
                  ) in peaks:


                      # Nicht drei fast identische
                      # Stellen aus demselben Moment.

                      if any(

                          abs(
                              center
                              - previous
                          )
                          < 95

                          for previous
                          in chosen

                      ):

                          continue


                      section_start = max(
                          0.0,
                          center - 9.0,
                      )


                      section_end = min(

                          duration,

                          section_start
                          + 34.0,
                      )


                      if (
                          section_end
                          - section_start
                          < 12
                      ):

                          continue


                      chosen.append(
                          center
                      )


                      results.append(
                          {

                              "id": (
                                  "yt_speed_"
                                  + video_id
                                  + "_"
                                  + str(
                                      int(
                                          section_start
                                      )
                                  )
                              ),

                              "title": (
                                  title
                                  + " | Most replayed"
                              ),

                              "url": raw_url,

                              "view_count": views,

                              "creator_name": (
                                  "IShowSpeed"
                              ),

                              "created_at": (
                                  created_at
                              ),

                              "duration": round(
                                  section_end
                                  - section_start,
                                  3,
                              ),

                              "broadcaster_name": (
                                  "IShowSpeed"
                              ),

                              "video_id": (
                                  "youtube:"
                                  + video_id
                              ),

                              "vod_offset": int(
                                  section_start
                              ),

                              "is_featured": True,

                              "source": "youtube",

                              "section_start": round(
                                  section_start,
                                  3,
                              ),

                              "section_end": round(
                                  section_end,
                                  3,
                              ),

                              "heat_value": round(
                                  heat_value,
                                  6,
                              ),
                          }
                      )


                      if len(
                          chosen
                      ) >= 3:

                          break


              print(
                  "Speed/YT: "
                  f"{len(results)} "
                  "Most-Replayed Segmente."
              )


              return results


          # --------------------------------------------------------
          # N3ON KICK
          # --------------------------------------------------------

          def get_value(
              item,
              *names,
              default="",
          ):

              for name in names:

                  value = item.get(
                      name
                  )

                  if value not in (
                      None,
                      "",
                  ):

                      return value


              return default


          def find_clip_list(
              payload,
          ):

              if isinstance(
                  payload,
                  list,
              ):

                  return [
                      item
                      for item in payload
                      if isinstance(
                          item,
                          dict,
                      )
                  ]


              if not isinstance(
                  payload,
                  dict,
              ):

                  return []


              for key in (
                  "clips",
                  "data",
                  "results",
                  "items",
              ):

                  value = payload.get(
                      key
                  )


                  if isinstance(
                      value,
                      list,
                  ):

                      return [
                          item
                          for item in value
                          if isinstance(
                              item,
                              dict,
                          )
                      ]


                  if isinstance(
                      value,
                      dict,
                  ):

                      nested = (
                          find_clip_list(
                              value
                          )
                      )

                      if nested:

                          return nested


              return []


          def n3on_kick_clips():

              headers = {

                  "User-Agent": (
                      "Mozilla/5.0 "
                      "(Windows NT 10.0; Win64; x64) "
                      "AppleWebKit/537.36 "
                      "Chrome/126 Safari/537.36"
                  ),

                  "Accept": (
                      "application/json,"
                      "text/plain,*/*"
                  ),

                  "Referer": (
                      "https://kick.com/n3on"
                  ),
              }


              merged = {}


              for sort in (
                  "view",
                  "date",
              ):

                  try:

                      response = requests.get(

                          (
                              "https://kick.com/"
                              "api/v2/channels/"
                              "n3on/clips"
                          ),

                          params={
                              "cursor": 0,
                              "sort": sort,
                              "time": "week",
                          },

                          headers=headers,

                          timeout=30,
                      )


                      response.raise_for_status()

                      payload = (
                          response.json()
                      )


                  except Exception as error:

                      print(
                          "Kick/N3on WARNUNG:",
                          error,
                      )

                      continue


                  for item in (
                      find_clip_list(
                          payload
                      )
                  ):

                      raw_id = get_value(
                          item,
                          "id",
                          "uuid",
                          "slug",
                      )


                      if not raw_id:

                          continue


                      clip_url = get_value(
                          item,
                          "clip_url",
                          "url",
                          "webpage_url",
                      )


                      slug = str(
                          get_value(
                              item,
                              "slug",
                              "uuid",
                              default="",
                          )
                      ).strip()


                      if not clip_url and slug:

                          clip_url = (
                              "https://kick.com/"
                              "n3on?clip="
                              + slug
                          )


                      if not clip_url:

                          continue


                      clip_url = str(
                          clip_url
                      )


                      if clip_url.startswith(
                          "/"
                      ):

                          clip_url = (
                              "https://kick.com"
                              + clip_url
                          )


                      try:

                          views = int(
                              get_value(
                                  item,
                                  "view_count",
                                  "views",
                                  "views_count",
                                  default=0,
                              )
                              or 0
                          )

                      except Exception:

                          views = 0


                      try:

                          duration = float(
                              get_value(
                                  item,
                                  "duration",
                                  "clip_duration",
                                  default=0,
                              )
                              or 0
                          )

                      except Exception:

                          duration = 0


                      if duration > 1000:

                          duration /= 1000


                      # Discovery nicht blockieren,
                      # falls Kick keine Dauer liefert.
                      # Quality Gate prüft echte Dauer.

                      if duration <= 0:

                          duration = 30.0


                      clip_id = (
                          "kick_n3on_"
                          + str(
                              raw_id
                          )
                      )


                      merged[
                          clip_id
                      ] = {

                          "id": clip_id,

                          "title": str(
                              get_value(
                                  item,
                                  "title",
                                  "clip_title",
                                  default=(
                                      "N3on clip"
                                  ),
                              )
                          ),

                          "url": clip_url,

                          "view_count": (
                              views
                          ),

                          "creator_name": "",

                          "created_at": str(
                              get_value(
                                  item,
                                  "created_at",
                                  "createdAt",
                                  "created",
                                  default="",
                              )
                          ),

                          "duration": duration,

                          "broadcaster_name": (
                              "N3on"
                          ),

                          "video_id": (
                              "kick:"
                              + str(
                                  get_value(
                                      item,
                                      "video_id",
                                      "livestream_id",
                                      default=raw_id,
                                  )
                              )
                          ),

                          "vod_offset": None,

                          "is_featured": False,

                          "source": "kick",
                      }


              print(
                  "Kick/N3on: "
                  f"{len(merged)} Clips."
              )


              return list(
                  merged.values()
              )


          # --------------------------------------------------------
          # QUELLEN SAMMELN
          # --------------------------------------------------------

          raw_clips = []


          # KAI

          raw_clips.extend(
              twitch_clips(
                  KAI_LOGIN,
                  "Kai Cenat",
              )
          )


          # SPEED YOUTUBE FIRST

          speed_youtube = (
              speed_youtube_segments()
          )


          raw_clips.extend(
              speed_youtube
          )


          # Falls YouTube keine/zu wenige
          # Heatmap-Momente liefert,
          # Speed Twitch als Backup.

          if len(
              speed_youtube
          ) < 3:

              try:

                  raw_clips.extend(

                      twitch_clips(
                          SPEED_TWITCH_LOGIN,
                          "IShowSpeed",
                      )
                  )

                  print(
                      "Speed: "
                      "Twitch-Fallback aktiv."
                  )

              except Exception as error:

                  print(
                      "Speed Twitch "
                      "Fallback WARNUNG:",
                      error,
                  )


          # N3ON

          try:

              raw_clips.extend(
                  n3on_kick_clips()
              )

          except Exception as error:

              print(
                  "N3on WARNUNG:",
                  error,
              )


          # --------------------------------------------------------
          # HISTORY
          # --------------------------------------------------------

          used_raw = load_json(
              USED_FILE,
              [],
          )


          used = (

              {
                  str(value)
                  for value
                  in used_raw
              }

              if isinstance(
                  used_raw,
                  list,
              )

              else set()
          )


          history_raw = load_json(
              HISTORY_FILE,
              {},
          )


          history = (

              history_raw

              if isinstance(
                  history_raw,
                  dict,
              )

              else {}
          )


          raw_by_id = {

              str(
                  item.get(
                      "id",
                      "",
                  )
              ): item

              for item in raw_clips

              if str(
                  item.get(
                      "id",
                      "",
                  )
              ).strip()
          }


          # --------------------------------------------------------
          # SHARED RANKING
          # --------------------------------------------------------

          candidates = core.build_candidates(

              raw_clips,

              used,

              history,
          )


          # Shared Core kennt keine
          # YouTube Sections.
          # Deshalb Felder wieder ergänzen.

          for candidate in candidates:

              source_item = raw_by_id.get(

                  str(
                      candidate.get(
                          "id",
                          "",
                      )
                  ),

                  {},
              )


              source = str(
                  source_item.get(
                      "source"
                  )
                  or "twitch"
              )


              candidate[
                  "source"
              ] = source


              for field in (

                  "section_start",

                  "section_end",

                  "heat_value",
              ):

                  if field in source_item:

                      candidate[
                          field
                      ] = source_item[
                          field
                      ]


              # YouTubes eigene Most-Replayed
              # Information bekommt Bonus.

              if source == "youtube":

                  try:

                      heat_value = float(
                          source_item.get(
                              "heat_value"
                          )
                          or 0
                      )

                  except Exception:

                      heat_value = 0


                  candidate[
                      "metadata_score"
                  ] = round(

                      float(
                          candidate.get(
                              "metadata_score"
                          )
                          or 0
                      )

                      + min(
                          18.0,
                          heat_value * 18.0,
                      ),

                      3,
                  )


                  candidate[
                      "selected_by"
                  ] = (
                      "youtube_most_"
                      "replayed"
                  )


              elif source == "kick":

                  candidate[
                      "selected_by"
                  ] = (
                      "kick_recent"
                  )


              else:

                  candidate[
                      "selected_by"
                  ] = (
                      "twitch_recent"
                  )


          candidates.sort(

              key=lambda item: float(

                  item.get(
                      "metadata_score"
                  )

                  or 0
              ),

              reverse=True,
          )


          candidates = (
              candidates[:18]
          )


          save_json(

              OUTPUT_FILE,

              candidates,
          )


          # --------------------------------------------------------
          # LOG
          # --------------------------------------------------------

          source_counts = {}


          for candidate in candidates:

              source = str(
                  candidate.get(
                      "source"
                  )
                  or "unknown"
              )


              source_counts[
                  source
              ] = (

                  source_counts.get(
                      source,
                      0,
                  )

                  + 1
              )


          print(
              "=" * 72
          )

          print(
              "CLIPCRIP3 US"
          )

          print(
              "Quellen:",
              source_counts,
          )


          for (
              number,
              candidate,
          ) in enumerate(
              candidates,
              start=1,
          ):

              print(

                  f"{number:02d}. "

                  f"{float(candidate.get('metadata_score', 0)):5.1f} | "

                  f"{str(candidate.get('source', '')):8} | "

                  f"{str(candidate.get('broadcaster_name', '')):12} | "

                  f"{int(candidate.get('view_count', 0) or 0):8} Views | "

                  f"{str(candidate.get('title', ''))[:90]}"
              )


          if not candidates:

              raise RuntimeError(

                  "Keine frischen US-Clips "
                  "gefunden."
              )

          PY

      # ============================================================
      # DOWNLOAD
      #
      # YouTube:
      # Nur section_start bis section_end herunterladen.
      #
      # Twitch/Kick:
      # normalen Clip laden.
      # ============================================================

      - name: US Kandidaten herunterladen
        run: |
          python - <<'PY'
          import glob
          import json
          import os
          import subprocess
          import sys
          from pathlib import Path


          INPUT_FILE = (
              Path("us/clips_today.json")
          )

          OUTPUT_DIR = (
              Path("us/downloaded_clips")
          )


          OUTPUT_DIR.mkdir(
              parents=True,
              exist_ok=True,
          )


          for path in (
              OUTPUT_DIR.iterdir()
          ):

              if path.is_file():

                  path.unlink()


          clips = json.loads(

              INPUT_FILE.read_text(
                  encoding="utf-8"
              )
          )


          successful = 0


          for (
              number,
              clip,
          ) in enumerate(
              clips,
              start=1,
          ):

              url = str(
                  clip.get(
                      "url",
                      "",
                  )
              ).strip()


              if not url:

                  continue


              output = str(

                  OUTPUT_DIR
                  / (
                      f"clip_{number}."
                      "%(ext)s"
                  )
              )


              command = [

                  sys.executable,

                  "-m",

                  "yt_dlp",

                  "--no-playlist",

                  "--retries",
                  "3",

                  "--fragment-retries",
                  "3",

                  "--concurrent-fragments",
                  "4",

                  "-f",
                  (
                      "bestvideo+bestaudio/"
                      "best"
                  ),

                  "--merge-output-format",
                  "mp4",

                  "-o",
                  output,
              ]


              section_start = (
                  clip.get(
                      "section_start"
                  )
              )

              section_end = (
                  clip.get(
                      "section_end"
                  )
              )


              if (
                  section_start is not None
                  and section_end is not None
              ):

                  command += [

                      "--download-sections",

                      (
                          "*"
                          + str(
                              float(
                                  section_start
                              )
                          )
                          + "-"
                          + str(
                              float(
                                  section_end
                              )
                          )
                      ),

                      "--force-keyframes-at-cuts",
                  ]


                  print(
                      "YOUTUBE SECTION:",
                      section_start,
                      "->",
                      section_end,
                  )


              command.append(
                  url
              )


              print(
                  ""
              )

              print(
                  "=" * 64
              )

              print(
                  f"DOWNLOAD "
                  f"{number}/"
                  f"{len(clips)}"
              )

              print(
                  clip.get(
                      "broadcaster_name"
                  ),
                  "|",
                  clip.get(
                      "source"
                  ),
              )

              print(
                  clip.get(
                      "title"
                  )
              )


              result = subprocess.run(
                  command,
                  check=False,
              )


              if result.returncode == 0:

                  successful += 1

              else:

                  print(
                      "DOWNLOAD FEHLER - "
                      "nächster Kandidat."
                  )


          print(
              f"{successful} Kandidaten "
              "erfolgreich geladen."
          )


          if successful == 0:

              raise RuntimeError(
                  "Kein Kandidat konnte "
                  "geladen werden."
              )

          PY

