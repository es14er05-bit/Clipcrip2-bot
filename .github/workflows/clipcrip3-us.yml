          )

          q.REPORT_FILE = (
              "us/selection_report.json"
          )


          q.TARGET_COUNT = 2

          q.MIN_COUNT = 1

          q.MAX_FINAL_COUNT = 2


          # Nicht unnötig 18 Videos mit
          # Whisper bearbeiten.
          # Erst Metadata Ranking,
          # dann Top 14 semantisch prüfen.

          q.SEMANTIC_POOL_SIZE = 14


          q.PREMIUM_SCORE = 64.0

          q.GOOD_SCORE = 50.0

          q.FALLBACK_SCORE = 38.0


          q.WHISPER_PROMPT = (

              "English livestream clips featuring "
              "Kai Cenat, IShowSpeed or N3on. "

              "Speakers talk quickly and use "
              "internet slang. "

              "Transcribe exactly. "

              "Keep names, reactions and slang "
              "such as bro, chat, W, L, nah, "
              "Kai, Speed, N3on, crazy, "
              "crashout and no way."
          )


          q.REACTION_TERMS = {

              "crashout": 4.0,

              "crash out": 4.0,

              "rage": 3.5,

              "scream": 3.0,

              "screaming": 3.0,

              "wtf": 3.5,

              "what the": 2.0,

              "oh my god": 3.0,

              "omg": 2.5,

              "no way": 3.0,

              "nah": 1.0,

              "crazy": 2.0,

              "insane": 2.5,

              "laugh": 2.0,

              "hahaha": 3.0,

              "funny": 1.5,

              "fail": 2.5,

              "roast": 2.5,

              "troll": 2.0,

              "caught": 2.0,

              "exposed": 2.0,

              "bro": 0.5,

              "chat": 0.5,
          }


          q.PROMO_TERMS = {

              "follow me": 4.0,

              "follow him": 4.0,

              "subscribe": 4.0,

              "sub to": 4.0,

              "link in bio": 4.0,

              "new upload": 3.0,

              "new video": 2.5,

              "sponsor": 2.5,

              "giveaway": 3.0,
          }


          # Whisper EN statt DE.

          def transcribe_english(
              model,
              path,
          ):

              raw = model.transcribe(

                  str(path),

                  language="en",

                  task="transcribe",

                  word_timestamps=True,

                  initial_prompt=(
                      q.WHISPER_PROMPT
                  ),

                  temperature=0.0,

                  condition_on_previous_text=False,

                  fp16=False,

                  verbose=False,
              )


              return q.compact_transcript(
                  raw
              )


          q.transcribe = (
              transcribe_english
          )


          q.main()

