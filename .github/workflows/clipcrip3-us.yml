      # ============================================================
      # CHECK
      # ============================================================

      - name: Ergebnis prüfen
        run: |
          python - <<'PY'
          import json
          from pathlib import Path


          output_dir = Path(
              "us/tiktok_ready"
          )


          videos = sorted(
              output_dir.glob(
                  "*.mp4"
              )
          )


          manifest_file = (
              output_dir
              / "publish_manifest.json"
          )


          if not manifest_file.exists():

              raise SystemExit(
                  "publish_manifest.json fehlt."
              )


          manifest = json.loads(

              manifest_file.read_text(
                  encoding="utf-8"
              )
          )


          print(
              "Finale Videos:",
              len(videos),
          )

          print(
              "Status:",
              manifest.get(
                  "status"
              ),
          )


          if not (
              1
              <= len(videos)
              <= 2
          ):

              raise SystemExit(

                  "Es müssen 1 bis 2 "
                  "fertige Videos sein."
              )


          if (
              manifest.get(
                  "status"
              )
              != "ready"
          ):

              raise SystemExit(
                  "Manifest nicht READY."
              )


          if int(
              manifest.get(
                  "output_count",
                  -1,
              )
          ) != len(
              videos
          ):

              raise SystemExit(
                  "Manifest-Anzahl falsch."
              )


          for video in videos:

              size = (
                  video.stat()
                  .st_size
              )


              if size < 100_000:

                  raise SystemExit(
                      f"{video.name} "
                      "ist zu klein."
                  )


              print(
                  "OK:",
                  video.name,
                  f"{size / 1024 / 1024:.1f} MB",
              )


          print(
              "=" * 60
          )

          print(
              "CLIPCRIP3 US READY"
          )

          print(
              "=" * 60
          )

          PY

